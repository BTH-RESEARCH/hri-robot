# Base config. Profiles (laptop.yaml / pi5.yaml) are deep-merged on top of this.
# Override any key from CLI:  hri run --set llm.temperature=0.5 --set ui.fullscreen=true

app:
  name: hri-robot
  language: vi
  log_level: INFO

paths:
  models_dir: ~/.cache/hri-robot/models   # env HRI_MODELS_DIR overrides
  data_dir: ~/.local/share/hri-robot      # research logs, snapshots

models:
  manifest: configs/models.json
  # GitHub Release that hosts the FER packs (.ferpack built by the fer_edge export notebooks)
  release:
    repo: BTH-RESEARCH/fer_edge
    tag: v0.1.0
  # which manifest entries this profile needs (hri models download)
  required: [fer, yunet, silero_vad, asr_vi, tts_vi]

camera:
  backend: opencv          # opencv | picamera2
  index: 0
  width: 640
  height: 480
  fps: 30
  flip_horizontal: true

vision:
  enabled: true
  target_fps: 10           # FER inference rate (not camera rate)
  face_detector:
    model: yunet
    score_threshold: 0.8
    min_face_size: 40      # px (same as the FER demo)
    margin: 0.15           # square crop, enlarged by margin on each side (same as the FER demo)
  fer:
    model: fer             # manifest key -> folder with model.onnx + fer.json
    # Preprocessing (classes, img_size, grayscale, train_res, mean/std) is read from the pack's fer.json,
    # so it always matches training. FERPlus: gray -> 48x48 (BOX) -> RGB -> 224 (BILINEAR) -> ImageNet norm.
    num_threads: 2
  # ---- Post-processing inherited from fer_resnet_demo v2 (= ablation V3b, runners.py webcam chain):
  #      softmax -> sensitivity -> personal baseline -> hysteresis + 2 biomechanical rules
  #      Each stage can be switched off for ablation (enabled: false).
  sensitivity:             # 1. cost-sensitive scaling  P'_c = w_c P_c / sum(w_j P_j)   (fer_demo/loss.py)
    enabled: true
    weights: {neutral: 0.45, happiness: 0.95, surprise: 1.15, sadness: 1.85, anger: 1.90,
              fear: 3.00, contempt: 3.40, disgust: 3.60}
  baseline:                # 2. personal resting-face baseline + Dynamic Gain Control (fer_demo/calibration.py)
    enabled: true
    calib_seconds: 3.0     # user looks at the robot with a resting face
    min_samples: 5
    max_non_neutral: 0.15  # sanity clamp: non-neutral share of P_base capped, surplus -> neutral
    neutral_margin: 0.20
    dynamic_neutral_suppress: true   # extra neutral penalty = 2.2 x largest positive non-neutral delta
    delta_gain: 2.0        # gain for classes missing from class_gains
    class_gains: {neutral: 1.0, happiness: 1.6, surprise: 2.0, sadness: 3.2, anger: 3.2,
                  fear: 3.4, contempt: 3.4, disgust: 3.6}
    adaptive_momentum: 0.0 # >0: slowly update P_base while the user is neutral
  hysteresis:              # 3. stable label: dual thresholds + biomechanical rules (fer_demo/temporal.py)
    enabled: true
    t_min: 0.25            # a candidate must hold this long before the label switches
    min_dwell_s: 0.25      # rule 1: refractory time of an expression (unless candidate >= 0.85)
    neutral_bridge_s: 0.25 # rule 1: negative <-> positive must pass through neutral this long
    fade_grace_s: 0.20     # do not drop to neutral on a 1-2 frame blink
    transition_dynamics: true        # rules 1 + 2 (false = ablation V3a)
    barrier_opposing: 0.35 # rule 2 fallback barriers (the transition matrix is built in)
    barrier_distant: 0.15
    theta_start: 0.55      # defaults for classes missing from class_thresholds
    theta_end: 0.35
    class_thresholds:
      neutral: {start: 0.55, end: 0.38}
      happiness: {start: 0.38, end: 0.22}
      surprise: {start: 0.32, end: 0.18}
      sadness: {start: 0.24, end: 0.12}
      anger: {start: 0.24, end: 0.12}
      fear: {start: 0.18, end: 0.08}
      contempt: {start: 0.18, end: 0.08}
      disgust: {start: 0.18, end: 0.08}
  smoothing:               # EMA is no longer in the demo's chain (comparator only) -> off by default
    enabled: false
    alpha: 0.45
    reset_after: 10        # frames without a face before the per-user state is reset

affect:
  buffer_sec: 60
  pre_utterance_sec: 1.0     # frames before speech onset also count
  speaking_weight: 0.3       # down-weight frames while user talks (mouth motion confuses FER)
  min_frames: 3
  trend_threshold: 0.05      # valence slope (/s) for rising/falling
  baseline_alpha: 0.05       # EMA rate of per-session valence baseline
  incongruence_threshold: 0.6
  stability:                 # Emotional Stability (Fluid-Xpress Eq. 1-2) over the utterance window
    m_max: 0.1               # paper values (EmoNet) - recalibrate on your own sessions
    p_max: 0.3
    acute_threshold: 0.15    # |dV| or |dA| per step counted as an acute change (not given in the paper)
    resample_hz: 5           # fixed rate so ES is comparable between laptop and Pi5 (0 = off)
    max_gap_sec: 0.5         # no successive difference across face-loss gaps

audio:
  sample_rate: 16000
  input_device: null         # name or index; null = system default
  output_device: null
  barge_in: false            # true needs echo cancellation / headset
  vad:
    model: silero_vad
    threshold: 0.5
    min_silence_duration: 0.5
    min_speech_duration: 0.25
    max_speech_duration: 15
  asr:
    model: asr_vi
    num_threads: 2
    decoding_method: greedy_search
  tts:
    model: tts_vi
    num_threads: 2
    speed: 1.0
    speaker_id: 0

llm:
  # tried in order; falls back to the next on error before the first token
  # Measured 2026-11: gemini-3.5-flash-lite TTFT ~1.1 s. Avoid non-lite "flash" models for dialogue:
  # they "think" first (TTFT 6-10 s) and thinking tokens eat max_tokens -> truncated replies.
  # gemini-2.5-flash is still listed by the API but returns 404 for chat.
  # List models your key can use:  hri check llm --list-models
  providers:
    - name: gemini
      base_url: https://generativelanguage.googleapis.com/v1beta/openai/
      model: gemini-3.5-flash-lite        # pinned version -> reproducible experiments
      api_key_env: GEMINI_API_KEY
    - name: gemini-fallback               # same key, Google's moving alias
      base_url: https://generativelanguage.googleapis.com/v1beta/openai/
      model: gemini-flash-lite-latest
      api_key_env: GEMINI_API_KEY
    - name: groq                          # 403 "Access denied" = region/network block, not a code issue
      base_url: https://api.groq.com/openai/v1
      model: llama-3.3-70b-versatile
      api_key_env: GROQ_API_KEY
    - name: openrouter
      base_url: https://openrouter.ai/api/v1
      model: google/gemma-4-31b-it:free
      api_key_env: OPENROUTER_API_KEY
      # optional per provider: extra_body: {...}  (passed through to the API)
  temperature: 0.7
  max_tokens: 256
  timeout_sec: 15

memory:                      # one encounter = one session; RAM only, wiped when the user leaves
  idle_sec: 45               # session ends after this long with no face AND no speech
  idle_no_vision_sec: 180    # without a camera: silence only
  rearm_sec: 5               # after a goodbye, wait until the face is gone this long before greeting again
  keep_turns: 6              # most recent turns always kept verbatim
  summarize_every: 4         # older turns are folded into the summary in batches of this size
  max_turns: 14              # hard cap if summaries keep failing
  summary_words: 80

expression:
  default: neutral
  # the ONLY labels the LLM may emit in [EMO:label|intensity]
  allowed: [neutral, happy, sad, surprised, empathy, thinking, curious, concerned, excited, calm]

cold_start:                  # Initial Engagement Protocol (Fluid-Xpress): calibrate, then greet
  frames: 12                 # calibrated frames (after the baseline) used to pick the greeting
  positive_valence: 0.2      # mean V above -> positive greeting
  negative_valence: -0.2     # mean V below -> supportive greeting
  timeout_sec: 12            # give up measuring if the person moves or leaves

micro_loop:                  # non-verbal feedback (Fluid-Xpress): 1 s sliding window of V/A
  enabled: true
  update_sec: 1.0            # how often the robot re-evaluates its face
  window_sec: 1.0
  min_frames: 3              # fewer frames in the window -> keep the current face
  positive_valence: 0.2      # V >= -> Mirroring
  negative_valence: -0.2     # V <= -> Support
  high_arousal: 0.5          # A >= (and V not positive) -> De-escalation
  min_intensity: 0.3
  max_intensity: 0.8

safety:
  enabled: true
  negative_valence_threshold: -0.6
  keywords: ["muốn chết", "tự tử", "không muốn sống", "tự làm hại", "kết thúc tất cả", "chán sống"]
  support_message: "Mình rất tiếc khi bạn đang cảm thấy như vậy. Bạn không một mình đâu. Nếu bạn đang gặp nguy hiểm, hãy gọi ngay cho người thân hoặc đường dây hỗ trợ khẩn cấp nhé."

test_ui:                     # `hri test` debug window (camera + FER results + robot face)
  width: 1100
  height: 620

ui:
  enabled: true
  fullscreen: false
  width: 800
  height: 480
  fps: 30
  sdl_videodriver: auto      # auto = kmsdrm on Linux without X/Wayland (Pi OS Lite), SDL default otherwise
  background: [10, 10, 18]
  face_color: [80, 220, 255]
  show_debug: false
